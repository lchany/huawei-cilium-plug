apiVersion: v1
kind: Namespace
metadata:
  name: cilium-matrix
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: matrix-a
  namespace: cilium-matrix
spec:
  selector:
    matchLabels:
      app: cilium-matrix
      set: a
  template:
    metadata:
      labels:
        app: cilium-matrix
        set: a
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: toolbox
        image: m.daocloud.io/docker.io/library/busybox:1.36.1
        command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: matrix-b
  namespace: cilium-matrix
spec:
  selector:
    matchLabels:
      app: cilium-matrix
      set: b
  template:
    metadata:
      labels:
        app: cilium-matrix
        set: b
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: toolbox
        image: m.daocloud.io/registry.k8s.io/e2e-test-images/agnhost:2.45
        command: ["/agnhost", "netexec", "--http-port=8080", "--udp-port=5353"]
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-headless
  namespace: cilium-matrix
spec:
  clusterIP: None
  selector:
    app: cilium-matrix
  ports:
  - name: placeholder
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-echo
  namespace: cilium-matrix
spec:
  selector:
    set: b
  ports:
  - name: tcp-echo
    protocol: TCP
    port: 8080
    targetPort: 8080
  - name: udp-echo
    protocol: UDP
    port: 5353
    targetPort: 5353
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-nodeport
  namespace: cilium-matrix
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    set: b
  ports:
  - name: tcp-echo
    protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30081
  - name: udp-echo
    protocol: UDP
    port: 5353
    targetPort: 5353
    nodePort: 30053
