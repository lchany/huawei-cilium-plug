spec:
  restartPolicy: Never
  containers:
  - name: check
    image: m.daocloud.io/docker.io/library/busybox:1.36.1
    command: ["sh", "-c", "sleep 300"]
    env:
    - name: CILIUM_HUAWEI_CLOUD_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: does-not-exist
          key: CILIUM_HUAWEI_CLOUD_ACCESS_KEY
          optional: false
