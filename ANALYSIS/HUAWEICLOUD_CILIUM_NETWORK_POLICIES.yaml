# Apply individual documents by the test-stage label. The full file represents
# the L3/L4 allow stage; DNS-only is kept in a separate file below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cilium-matrix
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-a-egress-to-b
  namespace: cilium-matrix
spec:
  podSelector:
    matchLabels:
      set: a
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchLabels:
          set: b
    ports:
    - protocol: TCP
      port: 8080
    - protocol: UDP
      port: 5353
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-b-ingress-from-a
  namespace: cilium-matrix
spec:
  podSelector:
    matchLabels:
      set: b
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          set: a
    ports:
    - protocol: TCP
      port: 8080
    - protocol: UDP
      port: 5353
